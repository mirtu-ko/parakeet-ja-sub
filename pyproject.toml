[project]
name = "parakeet-ja-sub"
version = "0.1.0"
description = "Transcribe Japanese audio from MP4 videos using NVIDIA Parakeet TDT 0.6B JA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.6.0",
    "pysrt",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
mlx = [
    "parakeet-mlx; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
nemo = [
    "nemo_toolkit[asr]",
    "torch>=2.9.1",
]

[project.scripts]
parakeet = "main:main"
parakeet-translate = "main:translate_cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["main.py", "test_main.py"]
venvPath = "."
venv = ".venv"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
