[project]
name = "parakeet-ja-sub"
version = "0.1.0"
description = "Transcribe Japanese audio from MP4 videos using NVIDIA Parakeet TDT 0.6B JA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.6.0",
    "nemo_toolkit[asr]",
    "pysrt",
    "python-dotenv>=1.2.2",
]

[project.scripts]
parakeet = "main:main"
parakeet-translate = "main:translate_cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
